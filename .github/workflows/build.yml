name: Compiler le mod

on:
  push:
  pull_request:
  workflow_dispatch:   # bouton "Run workflow" dans l'onglet Actions

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Preparer Gradle (avec cache)
        uses: gradle/actions/setup-gradle@v3

      - name: Rendre gradlew executable
        run: chmod +x gradlew

      - name: Compiler
        shell: bash
        run: |
          set -o pipefail
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Resume des erreurs de compilation
        if: failure()
        shell: bash
        run: |
          {
            echo "## Erreurs de compilation"
            echo
            echo "Copie ce bloc et envoie-le pour correction :"
            echo
            echo '```'
            grep -E "error:|\.java:[0-9]+: error" -A 3 build.log | head -400 || echo "Aucune ligne 'error:' : voir le log complet de l'etape Compiler."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publier le log complet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Publier le jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: aetheria-mod
          path: build/libs/*.jar
